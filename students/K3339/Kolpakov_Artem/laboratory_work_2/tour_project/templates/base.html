{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Туристическая фирма{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="container">
            <a class="logo" href="{% url 'tour_list' %}">Туристическая фирма</a>
            <div class="nav-links">
                <a href="{% url 'tour_list' %}">Туры</a>
                <a href="{% url 'sold_tour_list' %}">Проданные туры</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'reservation_list' %}">Бронирования</a>
                    <span class="username">{{ user.username }}</span>
                    <a href="{% url 'logout' %}">Выйти</a>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
