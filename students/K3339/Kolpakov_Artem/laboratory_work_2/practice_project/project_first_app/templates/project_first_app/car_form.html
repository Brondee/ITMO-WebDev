{% extends "base.html" %}

{% block title %}Автомобиль{% endblock %}

{% block content %}
<section class="form-card">
    <h1>{% if object %}Изменить автомобиль{% else %}Добавить автомобиль{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
</section>
{% endblock %}
